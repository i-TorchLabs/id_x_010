# ====================================================================
# id_x_010 部署编排（podman-compose，外部第三方 PostgreSQL 模式）
#
# 与 id_x_007 的部署模式对齐：不再内置 db / pgvector 容器，service
# 直连 .env 的 DB_* 指定的外部第三方 PostgreSQL；表结构与预置数据由
# 应用启动时幂等创建/播种（create_all + x_seed），ops/init/*.sql 仅作
# 手动初始化/审阅参考。
#
# 容器同处项目默认 bridge 网络，以服务名（DNS 别名）互访；
# 发布到宿主机的端口：haproxy 8080 → ${POD_PORT:-8010}。
#
# 用法（在本目录 ops/ 下执行）：
#   podman-compose up -d --build          # 构建并启动
#   podman-compose down                   # 停止并移除容器（../logs 日志保留）
#
# 注意：本文件与 up.sh/down.sh 是两套并存的管理方式，请勿混用
# （容器命名不同，混用会造成端口冲突）。
# ====================================================================

name: id_x_010

services:
  # -- 后端：Litestar + Granian（构建上下文必须是 i-Core 仓库根）；
  #    DB_* 直连外部第三方 PostgreSQL（见 .env） --
  service:
    build:
      context: ../../../
      dockerfile: x_models/id_x_010/ops/Dockerfile.service
    image: localhost/id_x_010-service
    env_file: .env
    environment:
      DB_NAME: ${DB_NAME:?请在 ops/.env 中设置 DB_NAME}
      DB_HOST: ${DB_HOST:?请在 ops/.env 中设置 DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${DB_USERNAME:?请在 ops/.env 中设置 DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD:?请在 ops/.env 中设置 DB_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PROJECT_PATH: /app/i-Core
    restart: unless-stopped
    volumes:
      # 日志透传：bind mount 到模块目录 x_models/id_x_010/logs——
      # 容器内 /app/i-Core/logs 的审计/引擎日志实时落宿主机，
      # 容器重建不丢失，运维无需 podman volume 命令即可查看/轮转。
      # 注意相对路径：compose 解析相对于本文件所在目录（ops/），
      # ../logs 即 x_models/id_x_010/logs；:Z 允许 SELinux 下容器写入。
      - ../logs:/app/i-Core/logs:Z
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -X POST http://127.0.0.1:7000/b/id_x_010/graphql -H 'Content-Type: application/json' -d '{\"query\":\"{ health { status } }\"}' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # -- 前端：Next.js（NEXT_PUBLIC_* 必须在构建期注入） --
  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_URL: ""
        NEXT_PUBLIC_SUB_VERSION: "/b/id_x_010/graphql"
        # SSO（ADFS OAuth2）公开配置：从 .env 读取，构建期内联进客户端 bundle。
        # client_secret 绝不作为构建参数（会进入镜像层，不可泄露）。
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_ADFS_CLIENT_ID: ${NEXT_PUBLIC_ADFS_CLIENT_ID:-}
        NEXT_PUBLIC_ADFS_REDIRECT_URI: ${NEXT_PUBLIC_ADFS_REDIRECT_URI:-}
        NEXT_PUBLIC_ADFS_RESOURCE: ${NEXT_PUBLIC_ADFS_RESOURCE:-}
        NEXT_PUBLIC_ADFS_BASE_URL: ${NEXT_PUBLIC_ADFS_BASE_URL:-}
    image: localhost/id_x_010-web
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # -- 入口：haproxy :8080 → 宿主机 ${POD_PORT:-8010}（/b/id_x_010/ 走后端，其余走前端） --
  haproxy:
    image: docker.io/library/haproxy:3.0
    restart: unless-stopped
    volumes:
      - ./haproxy.compose.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro,z
    ports:
      - "${POD_PORT:-8010}:8080"
    depends_on:
      - service
      - web

  # -- prometheus：抓取 service:8000/metrics（TASK-007）；不暴露到反向代理，
  #    仅宿主机 9090 调试，生产可关闭端口映射改由内网访问 --
  prometheus:
    image: docker.io/prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
    ports:
      - "${PROM_PORT:-9090}:9090"
    depends_on:
      - service
    networks:
      - default

# 显式固定卷名（不加 compose 项目前缀）——日志已改用 bind mount 透传至
# x_models/id_x_010/logs，本节无卷；保留注释说明历史迁移：
# 旧版使用 id_x_010_logs 命名卷，迁移后可 podman volume rm id_x_010_logs
volumes: {}
