# ============================================================================
# HAProxy 配置 —— id_x_010 四容器 Pod 流量入口
#
# 同 Pod 内所有容器共享 network namespace：
#   - web     监听 127.0.0.1:2000  (Next.js)
#   - service 监听 127.0.0.1:7000  (Litestar + GraphQL)
#   - haproxy 监听 :8080           (Pod 端口映射到宿主机 POD_PORT，默认 8010)
#
# 路由规则：
#   /b/id_x_010/   ->  service:7000   (后端 API / GraphQL / SSE)
#   其余           ->  web:2000       (前端页面 / 静态资源)
# ============================================================================

global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    option  http-keep-alive
    http-reuse safe
    retries 3
    option  redispatch
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    timeout http-request 10s
    timeout http-keep-alive 10s
    # Next.js 自身不压缩响应，由入口代理统一 gzip
    compression algo gzip
    compression type text/plain text/css text/html application/json application/javascript application/x-javascript text/xml application/xml image/svg+xml

frontend http_in
    bind *:8080
    # 后端 API 路径前缀
    acl is_api path_beg /b/id_x_010/
    use_backend service_backend if is_api
    default_backend web_backend

backend web_backend
    # Next.js 容器：GET / 会被 next.config.ts 重定向到 /f/010/login
    option httpchk GET /
    http-check expect rstatus ^(200|307|308)$
    server web 127.0.0.1:2000 check inter 10s fall 3 rise 2

backend service_backend
    # GraphQL 端点 GET 返回 400（期望 POST），只要任何 HTTP 响应即可视为存活；
    # 更严格的功能性健康检查由 service 容器的 --health-cmd（POST health 查询）承担。
    option httpchk GET /b/id_x_010/graphql
    http-check expect rstatus ^(200|400|405)$
    # SSE 流式响应受 server 不活跃超时保护，长思考间隔需放宽
    timeout server 600s
    server service 127.0.0.1:7000 check inter 10s fall 3 rise 2
