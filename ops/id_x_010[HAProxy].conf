# HAProxy 配置文件 - 支持 HTTPS (SSL/TLS)
# 域名: sme-tx-studio.cuhk.edu.cn
# 由 Nginx 配置转换而来

# ============================================
# Global 全局配置
# ============================================
global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user root
    group root
    daemon

    # SSL 设置
    tune.ssl.default-dh-param 2048

    # 最大连接数
    maxconn 4096

# ============================================
# Defaults 默认配置
# ============================================
defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000
    timeout client  50000
    timeout server  50000
    timeout http-request 60s
    timeout http-keep-alive 10s

    # 错误页面
    errorfile 400 /etc/haproxy/errors/400.http
    errorfile 403 /etc/haproxy/errors/403.http
    errorfile 408 /etc/haproxy/errors/408.http
    errorfile 500 /etc/haproxy/errors/500.http
    errorfile 502 /etc/haproxy/errors/502.http
    errorfile 503 /etc/haproxy/errors/503.http
    errorfile 504 /etc/haproxy/errors/504.http

# ============================================
# Frontend: HTTP (端口 80) - 重定向到 HTTPS
# ============================================
frontend http_front
    bind *:80
    acl is_root path /
    acl is_host_sme hdr(host) -i sme-tx-studio.cuhk.edu.cn

    # 将所有 HTTP 请求重定向到 HTTPS
    http-request redirect scheme https code 301 if !{ ssl_fc }

# ============================================
# Frontend: HTTPS (端口 443) - SSL 终止
# ============================================
frontend https_front
    bind *:443 ssl crt /etc/nginx/ssl/server.pem alpn h2,http/1.1
    # 注意: HAProxy 需要将证书和私钥合并为一个 .pem 文件
    # 命令: cat /etc/nginx/ssl/server.crt /etc/nginx/ssl/server.key > /etc/nginx/ssl/server.pem

    # SSL 协议配置
    # HAProxy 2.x 默认支持 TLSv1.2 和 TLSv1.3
    # 如需更详细的加密套件配置，可使用 ssl-bind-options 和 ssl-default-bind-ciphers

    # 请求头设置
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Real-IP %[src]

    # ACL 规则 - 路由匹配
    acl is_root_path path /
    acl is_nextjs_static path_beg /_next/
    acl is_nextjs_app path_beg /f/
    acl is_backend_api path_beg /b/

    # 路由决策
    # 1. 根路径重定向到 /f/010/login
    http-request redirect location /f/010/login code 301 if is_root_path

    # 2. Next.js 静态资源
    use_backend nextjs_backend if is_nextjs_static

    # 3. Next.js 应用 (/f/ 路径)
    use_backend nextjs_backend if is_nextjs_app

    # 4. 后端 API (/b/ 路径)
    use_backend backend_api if is_backend_api

    # 5. 默认后端 (可选，用于处理未匹配的请求)
    default_backend nextjs_backend

# ============================================
# Backend: Next.js 应用 (端口 2000)
# ============================================
backend nextjs_backend
    balance roundrobin
    option httpchk GET /
    http-check send hdr Host localhost
    option forwardfor
    option http-server-close

    # 超时设置 (对应 Nginx 的 proxy_*_timeout)
    timeout connect 60s
    timeout server  60s
    timeout check   5s

    # WebSocket 支持 (对应 Nginx 的 Upgrade 和 Connection 头)
    http-request set-header Upgrade %[req.hdr(Upgrade)]
    http-request set-header Connection %[req.hdr(Connection)]

    # 后端服务器
    server nextjs_app 127.0.0.1:2000 check inter 2000 rise 2 fall 3

# ============================================
# Backend: 后端 API 服务 (端口 18080)
# ============================================
backend backend_api
    balance roundrobin
    option forwardfor
    option http-server-close

    # 超时设置
    timeout connect 60s
    timeout server  60s

    # 后端服务器
    server backend_srv 127.0.0.1:18080 check inter 2000 rise 2 fall 3

# ============================================
# Stats 统计页面 (可选)
# ============================================
listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if LOCALHOST

# ============================================
# 转换说明
# ============================================
#
# 1. SSL 证书格式转换:
#    HAProxy 需要将证书和私钥合并为一个 .pem 文件
#    执行命令:
#    cat /etc/nginx/ssl/server.crt /etc/nginx/ssl/server.key > /etc/nginx/ssl/server.pem
#
# 2. SSL 加密套件配置:
#    如需配置与 Nginx 相同的加密套件，可在 global 部分添加:
#    ssl-default-bind-ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4
#    ssl-default-bind-options ssl-min-ver TLSv1.2
#
# 3. Gzip 压缩:
#    HAProxy 本身不提供 gzip 压缩功能，建议:
#    - 在后端应用中实现压缩
#    - 或使用 HAProxy 的 "compression" 指令 (HAProxy 1.8+)
#    示例:
#    compression algo gzip
#    compression type text/plain text/css application/json application/javascript text/xml
#
# 4. 日志配置:
#    需要配置 rsyslog 来接收 HAProxy 日志
#    参考: /etc/rsyslog.d/haproxy.conf
#
# 5. 文件上传大小限制:
#    HAProxy 没有直接的 client_max_body_size 等效配置
#    但可以通过以下方式限制请求体大小:
#    http-request deny if { req.body_size gt 1073741824 }  # 1GB = 1024*1024*1024 bytes
#
# 6. HTTP/2 支持:
#    已在 bind 指令中启用 alpn h2,http/1.1
#
# 7. 主要路由映射:
#    - /              → 重定向到 /f/010/login
#    - /_next/*       → nextjs_backend (127.0.0.1:2000)
#    - /f/*           → nextjs_backend (127.0.0.1:2000)
#    - /b/*           → backend_api (127.0.0.1:18080)
#
# ============================================
